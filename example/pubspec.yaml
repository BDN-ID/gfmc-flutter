name: gfmc_flutter_example
description: Demonstrates how to use the gfmc_flutter plugin.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  gfmc_flutter:
    git:
      url: https://github.com/BDN-ID/gfmc-flutter.git
      ref: v0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Dev convenience only — makes this example build against the plugin's
# working tree in this monorepo instead of fetching the git ref above.
# Delete this override (or run `flutter pub get` in a checkout that lacks
# it) to test exactly what a real consumer gets from the public repo.
dependency_overrides:
  gfmc_flutter:
    path: ../

flutter:
  uses-material-design: true
